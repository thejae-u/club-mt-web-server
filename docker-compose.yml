services:
  web:
    build:
      context: .
      dockerfile: ClubMTServer/Dockerfile
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    networks:
      - backend-net
    restart: always
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.31.1-alpine
    ports:
      - "127.0.0.1:8000:80" # Allow access ONLY from host machine for local testing
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./club-mt-page:/usr/share/nginx/html:ro
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - web
    restart: always
    security_opt:
      - no-new-privileges:true

  tunnel:
    image: cloudflare/cloudflared
    restart: always
    command: tunnel run --token ${TUNNEL_TOKEN}
    networks:
      - frontend-net
    depends_on:
      - nginx
    security_opt:
      - no-new-privileges:true

networks:
  frontend-net:
  backend-net:

volumes:
  data:
