services:
  web:
    build:
      context: .
      dockerfile: ClubMTServer/Dockerfile
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./data/logs:/app/data/logs
    networks:
      - backend-net
    restart: always
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.31.1-alpine
    ports:
      - "127.0.0.1:8000:80" # Allow access ONLY from host machine for local testing
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./club-mt-page:/usr/share/nginx/html:ro
      - ./data/logs/nginx:/var/log/nginx
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - web
    restart: always
    security_opt:
      - no-new-privileges:true

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    ports:
      - "127.0.0.1:8888:8080" # Local access only
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend-net
    restart: always

  goaccess:
    image: allinurl/goaccess:latest
    container_name: goaccess
    ports:
      - "127.0.0.1:7890:7890" # Local access only
    volumes:
      - ./data/logs/nginx:/srv/logs
      - ./data/logs/nginx:/srv/report
    entrypoint: /bin/sh -c
    command: >
      "while [ ! -f /srv/logs/access.log ]; do sleep 1; done &&
      goaccess --log-file=/srv/logs/access.log
      --output=/srv/report/report.html
      --log-format='[%d:%t %^] %h \"%r\" %s %b \"%R\" (%T s)'
      --date-format=%d/%b/%Y
      --time-format=%H:%M:%S
      --real-time-html
      --addr=0.0.0.0
      --port=7890
      --ws-url=ws://localhost:7890
      --origin=http://localhost:8000"
    networks:
      - backend-net
    restart: always

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel run --token ${TUNNEL_TOKEN}
    networks:
      - frontend-net
    depends_on:
      - nginx
    security_opt:
      - no-new-privileges:true

networks:
  frontend-net:
  backend-net:

volumes:
  data:
