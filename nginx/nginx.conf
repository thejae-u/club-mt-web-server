events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    # Cloudflare IP Ranges (IPv4)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;

    # Cloudflare IP Ranges (IPv6)
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # Docker Internal Networks
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;

    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

    client_max_body_size 50M;
    client_body_buffer_size 128k;
    client_header_buffer_size 8k;
    large_client_header_buffers 4 32k;
    client_body_timeout 300s;

    log_format readable '[$time_local] $remote_addr "$request" $status $body_bytes_sent "$http_referer" ($request_time s)';

    upstream backend_servers {
        server web:8080;
    }

    server {
        listen 80 default_server;
        server_name mt.thejaeu.com api-mt.thejaeu.com localhost _;

        absolute_redirect off;

        access_log /var/log/nginx/access.log readable;
        error_log /var/log/nginx/error.log;
        access_log /dev/stdout readable;
        error_log /dev/stderr;

        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;

        # Security Headers - Defined here but will be reapplied in locations if needed
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Block access to .env and other hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # [보안] 1. 오픈 상태 조회 API: 보안 강화를 위해 요청 제한 적용
        location = /api/Settings/open-status {
            # 초당 5회 제한, 순간적인 연타(Burst) 20회까지 허용
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # [보안] 2. 나머지 모든 API: 리퍼러 또는 오리진 체크
        location /api/ {
            set $allow_api 0;
            if ($http_referer ~* "^https?://(.*\.)?(thejaeu\.com|thejae-u\.github\.io|localhost|127\.0\.0\.1)") {
                set $allow_api 1;
            }
            if ($http_origin ~* "^https?://(.*\.)?(thejaeu\.com|thejae-u\.github\.io|localhost|127\.0\.0\.1)") {
                set $allow_api 1;
            }
            if ($allow_api = 0) {
                return 403;
            }

            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection keep-alive;
            proxy_set_header Host $http_host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Uploads Proxy
        location /uploads/ {
            # Re-apply headers
            add_header X-Debug-Nginx "Hit-Uploads" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer-when-downgrade" always;
            add_header Cache-Control "public, max-age=31536000" always;

            # 보안: 리퍼러 또는 오리진 체크 (직접 접근 차단)
            set $allow_upload 0;
            if ($http_referer ~* "^https?://(.*\.)?(thejaeu\.com|thejae-u\.github\.io|localhost|127\.0\.0\.1)") {
                set $allow_upload 1;
            }
            if ($http_origin ~* "^https?://(.*\.)?(thejaeu\.com|thejae-u\.github\.io|localhost|127\.0\.0\.1)") {
                set $allow_upload 1;
            }
            if ($allow_upload = 0) {
                return 403;
            }

            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection keep-alive;
            proxy_set_header Host $http_host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Obfuscated Real Site: 게이트웨이를 통한 접근 허용
        location /real_v5_mt_2026_q8z7x2/ {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;
        }

        # Admin Pages (Clean URLs): 로컬 개발 및 관리 편의를 위해 유지
        location = /manager-hq {
            default_type text/html;
            alias /usr/share/nginx/html/real_v5_mt_2026_q8z7x2/manager-hq.html;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
        }

        location = /manager-detail {
            default_type text/html;
            alias /usr/share/nginx/html/real_v5_mt_2026_q8z7x2/manager-detail.html;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
        }

        # Admin Assets: 관리자 페이지용 자산 매핑
        location /js/admin.js {
            alias /usr/share/nginx/html/real_v5_mt_2026_q8z7x2/js/admin.js;
        }
        location /css/admin.css {
            alias /usr/share/nginx/html/real_v5_mt_2026_q8z7x2/css/admin.css;
        }

        # Static Files - Serve frontend files
        location /stats {
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 10.0.0.0/8;
            deny all;
            alias /var/log/nginx;
            index report.html;
        }

        location / {
            # Block access if accessed via the API domain to prevent static file exposure
            if ($host = "api-mt.thejaeu.com") {
                return 403;
            }

            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri.html $uri/ =404;

            # Security: Apply same referer check for index.html if needed, 
            # or keep it open for the initial load.
            add_header X-Debug-Nginx "Hit-Static" always;
        }
    }
}
